<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>haolee - Bio</title>
    <!-- Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome cho icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: url('https://cdn.cursors-4u.net/cursors/animated/rgb-cursor-dark-normal-6e1535b0-32.cur'), auto !important;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        a, button, input[type="range"], .music-progress-wrap, #enter-screen {
            cursor: url('https://cdn.cursors-4u.net/cursors/animated/rgb-cursor-set-link-4c9544fb-32.cur'), pointer !important;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: fixed;
            perspective: 1400px;
            background: #000;
        }

        /* MÀN HÌNH CLICK TO ENTER (Đã tối ưu thời gian mượt mà, không bị delay) */
        #enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 3, 5, 0.95);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #enter-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-content {
            text-align: center;
            animation: pulseEnter 2.5s infinite ease-in-out;
        }

        .enter-text {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 3px;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
        }

        @keyframes pulseEnter {
            0%, 100% { opacity: 0.4; transform: scale(0.97); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /* Video nền động */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -4;
        }

        /* CANVAS TUYẾT RƠI */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -3;
            pointer-events: none;
        }

        /* CANVAS SỢI TƠ CẦU VỒNG */
        #trail-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            pointer-events: none;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        /* KHUNG BAO NGOÀI */
        .border-glow-wrapper {
            position: relative;
            width: 100%;
            max-width: 820px;
            border-radius: 38px;
            z-index: 1;
            opacity: 1; 
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* CONTAINER CHÍNH NGANG */
        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(18, 18, 24, 0.16);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border-radius: 36px;
            padding: 38px 42px;
            border: 1.5px solid rgba(255, 255, 255, 0.16);
            box-shadow: 
                0 40px 90px rgba(0, 0, 0, 0.4),
                inset 0 0 35px rgba(255, 255, 255, 0.02),
                inset 0 3px 6px rgba(255, 255, 255, 0.15),
                inset 0 -6px 12px rgba(0, 0, 0, 0.3);
            transform-style: preserve-3d;
        }

        /* PHẦN TRÊN: THÔNG TIN VÀ AVATAR LỚN BÊN PHẢI */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 26px;
            transform: translateZ(35px);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .glitch-name {
            font-family: 'Times New Roman', Times, serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.5));
        }

        .bio-text {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            margin-bottom: 14px;
            font-style: italic;
            min-height: 22px;
        }

        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social-icon-btn {
            color: #ffffff;
            font-size: 18px;
            background: rgba(25, 25, 32, 0.18);
            backdrop-filter: blur(20px);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.15), 
                inset 0 1px 2px rgba(255, 255, 255, 0.2),
                inset 0 -2px 4px rgba(0, 0, 0, 0.15);
            transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
            text-decoration: none;
        }

        .social-icon-btn:hover {
            transform: translateY(-3px) scale(1.1);
            background: rgba(35, 35, 45, 0.35);
            border-color: rgba(255, 255, 255, 0.35);
        }

        /* ẢNH NARUTO BÊN PHẢI (VIỀN 7 MÀU) */
        .avatar-glow-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 28px;
            overflow: visible; 
            flex-shrink: 0;
        }

        .avatar-glow-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px; 
            background: linear-gradient(
                45deg, 
                #ff0000, #ff7300, #fffb00, #48ff00, 
                #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000
            );
            background-size: 400%;
            border-radius: 32px;
            z-index: 0;
            filter: blur(6px);
            animation: rainbowGlowAnimation 6s linear infinite;
        }

        @keyframes rainbowGlowAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .avatar-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 24, 0.4);
            border-radius: 28px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.4),
                inset 0 0 15px rgba(255, 255, 255, 0.15);
            z-index: 1;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 26px;
            object-fit: cover;
            display: block;
        }

        /* PHẦN GIỮA: 2 CARD NGANG */
        .cards-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
            transform: translateZ(30px);
        }

        .card-box {
            background: rgba(25, 25, 32, 0.16);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.2), 
                inset 0 1px 3px rgba(255, 255, 255, 0.15),
                inset 0 -2px 5px rgba(0, 0, 0, 0.15);
            text-decoration: none;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
        }

        .card-box:hover {
            background: rgba(35, 35, 45, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .card-avatar-wrap {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 4px;
        }

        .card-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: block;
            z-index: 1;
        }

        .xehoi-decor {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 78px;
            height: 78px;
            pointer-events: none;
            object-fit: contain;
            z-index: 5;
            display: none; 
        }

        .status-dot {
            position: absolute;
            bottom: 0px;
            right: 0px;
            width: 12px;
            height: 12px;
            background-color: #71717a;
            border: 2px solid rgba(30, 30, 35, 0.7);
            border-radius: 50%;
            z-index: 6;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
            flex-grow: 1;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-name {
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .join-btn {
            background: #22c55e;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 2px 10px rgba(34, 197, 94, 0.4);
            flex-shrink: 0;
        }

        /* PHẦN DƯỚI: TRÌNH PHÁT NHẠC NGANG */
        .music-card {
            background: rgba(25, 25, 32, 0.16);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.2), 
                inset 0 1px 3px rgba(255, 255, 255, 0.15),
                inset 0 -2px 5px rgba(0, 0, 0, 0.15);
            transform: translateZ(25px);
        }

        .music-top-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .music-thumb {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .music-meta {
            flex-grow: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .music-song-name {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-style: italic;
        }

        .music-time-display {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.65);
            font-variant-numeric: tabular-nums;
        }

        .music-progress-wrap {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            position: relative;
            padding: 6px 0;
            margin: -2px 0;
            display: flex;
            align-items: center;
            touch-action: none; /* Ngăn trình duyệt cuộn trang khi đang kéo thanh tua */
        }

        .music-progress-bar {
            height: 4px;
            background: #ffffff;
            border-radius: 3px;
            width: 0%;
            position: relative;
            pointer-events: none;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        .music-bottom-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .music-btn {
            background: rgba(25, 25, 32, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #fff;
            font-size: 13px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .music-btn:hover {
            background: rgba(45, 45, 55, 0.45);
            color: #ff758c;
            transform: scale(1.1);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(25, 25, 32, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .volume-slider {
            width: 55px;
            height: 4px;
            accent-color: #fff;
            background: transparent;
            touch-action: none;
        }

        /* FOOTER DƯỚI CÙNG */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            transform: translateZ(20px);
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            animation: blinkCursor 0.8s infinite;
            margin-left: 6px;
            vertical-align: middle;
            font-style: normal !important;
            transform: none !important;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @media screen and (max-width: 768px) {
            body, html { padding: 10px; }
            .border-glow-wrapper { max-width: 100%; }
            .container { padding: 20px 16px; border-radius: 24px; }
            .top-section { flex-direction: column-reverse; align-items: center; text-align: center; gap: 16px; }
            .profile-info { align-items: center; width: 100%; }
            .name-row { justify-content: center; }
            .social-buttons { justify-content: center; }
            .cards-row { grid-template-columns: 1fr; gap: 12px; }
            .card-box, .music-card { padding: 12px 14px; }
            .avatar-glow-wrapper { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

    <!-- THẺ NHẠC NỀN -->
    <audio id="bg-audio"></audio>

    <!-- MÀN HÌNH CLICK TO ENTER -->
    <div id="enter-screen">
        <div class="enter-content">
            <div class="enter-text">[ Click to Enter ]</div>
        </div>
    </div>

    <!-- VIDEO NỀN ĐỘNG -->
    <video id="bg-video" autoplay muted loop class="video-background">
        <source src="boruto-uzumaki-katana-wallpaperwaifu-com.mp4" type="video/mp4">
    </video>

    <!-- CANVAS TUYẾT RƠI -->
    <canvas id="snow-canvas"></canvas>

    <!-- CANVAS SỢI TƠ CẦU VỒNG -->
    <canvas id="trail-canvas"></canvas>

    <div class="video-overlay"></div>

    <!-- KHUNG BAO NGOÀI -->
    <div class="border-glow-wrapper" id="main-wrapper">
        <div class="container">
            
            <!-- PHẦN TRÊN: TÊN, BIO & AVATAR LỚN -->
            <div class="top-section">
                <div class="profile-info">
                    <div class="name-row">
                        <div class="glitch-name">haolee</div>
                    </div>
                    <div class="bio-text" id="typing-bio"></div>
                    <div class="social-buttons">
                        <a href="https://discord.com/users/1430062256258941010" target="_blank" class="social-icon-btn profile-click" title="Discord">
                            <i class="fa-brands fa-discord"></i>
                        </a>
                        <a href="https://www.youtube.com/@DangKhoaCla" target="_blank" class="social-icon-btn profile-click" title="YouTube">
                            <i class="fa-brands fa-youtube"></i>
                        </a>
                        <a href="https://www.facebook.com/share/1AJyE7TBDr" target="_blank" class="social-icon-btn profile-click" title="Facebook">
                            <i class="fa-brands fa-facebook"></i>
                        </a>
                        <a href="https://tiktok.com/@haolee2009" target="_blank" class="social-icon-btn profile-click" title="TikTok">
                            <i class="fa-brands fa-tiktok"></i>
                        </a>
                    </div>
                </div>

                <div class="avatar-glow-wrapper">
                    <div class="avatar-container">
                        <img src="jjuidijdw.jpg" alt="Avatar" class="avatar" id="main-avatar">
                    </div>
                </div>
            </div>

            <!-- PHẦN GIỮA: 2 CARD DISCORD & SERVER -->
            <div class="cards-row">
                <a href="https://discord.com/users/1317692648521203772" target="_blank" class="card-box profile-click">
                    <div class="card-avatar-wrap">
                        <img id="dc-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" alt="Discord Avatar" class="card-avatar">
                        <img id="xehoi-decor" class="xehoi-decor" alt="Avatar Decoration">
                        <div id="dc-status-dot" class="status-dot"></div>
                    </div>
                    <div class="card-info">
                        <div class="card-title-row">
                            <span id="dc-name" class="card-name">Đang tải...</span>

                <a href="https://discord.gg/g5VSce56e" target="_blank" class="card-box profile-click" id="server-card-box">
                    <div class="card-avatar-wrap">
                        <img id="sv-icon" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=200&auto=format&fit=crop" alt="Server Icon" class="card-avatar" style="border-radius: 14px;">
                    </div>
                    <div class="card-info">
                        <div class="card-title-row">
                            <span id="sv-name" class="card-name">Cla family</span>

            <!-- PHẦN DƯỚI: TRÌNH PHÁT NHẠC NGANG -->
            <div class="music-card">
                <div class="music-top-row">
                    <img src="20c331e4095fe89305af502a9de8f6b0.jpg" alt="Thumb" class="music-thumb" id="music-thumb">
                    <div class="music-meta">
                        <div class="music-song-name" id="song-name-display">Duyen duyen so so</div>
                        <div class="music-time-display">
                            <span id="current-time">0:00</span> / <span id="total-time">0:00</span>

                <div class="music-progress-wrap" id="progress-wrap" title="Tua nhạc">
                    <div class="music-progress-bar" id="progress-bar"></div>

                <div class="music-bottom-row">

                    </div>

            <!-- FOOTER DƯỚI CÙNG -->
            <div class="card-footer">
                <span id="live-clock"><i class="fa-regular fa-clock"></i> 19:43:44</span>

                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT XỬ LÝ -->
    <script>
        // --- DANH SÁCH 5 BÀI HÁT (TỰ ĐỘNG CHUYỂN BÀI KHI KẾT THÚC) ---
        const playlist = [
            {
                title: "Quen em trong tung con dau remix",
                file: "nhac.mp3"
            },
            {
                title: "Duyen duyen so so",
                file: "nhac2.mp3"
            },
            {
                title: "Quen mot tung yeu",
                file: "nhac3.mp3"
            },
            {
                title: "Quen em trong tung con dau lofi",
                file: "nhac4.mp3"
            },
            {
                title: "Oliver Tree - Life Goes On",
                file: "nhac5.mp3"
            }
        ];

        let currentTrackIndex = 0;

        // --- XỬ LÝ TĂNG LƯỢT XEM ---
        const viewCountEl = document.getElementById('view-count');
        const STORAGE_KEY = 'haolee_profile_views_v2';
        
        let currentViews = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
        
        if (!sessionStorage.getItem('viewed_this_session_v2')) {
            currentViews += 1;
            sessionStorage.setItem('viewed_this_session_v2', 'true');
            localStorage.setItem(STORAGE_KEY, currentViews);
        }
        
        viewCountEl.innerText = currentViews;

        const profileLinks = document.querySelectorAll('.profile-click');
        profileLinks.forEach(link => {
            link.addEventListener('click', () => {
                currentViews += 1;
                localStorage.setItem(STORAGE_KEY, currentViews);
                viewCountEl.innerText = currentViews;
            });
        });

        const wrapper = document.getElementById('main-wrapper');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let currentRotateX = 0, currentRotateY = 0;
        let targetRotateX = 0, targetRotateY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
            }
        }, { passive: true });

        function updateTilt() {
            const rect = wrapper.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            targetRotateX = (-(mouseY - centerY) / (window.innerHeight / 2)) * 10;
            targetRotateY = ((mouseX - centerX) / (window.innerWidth / 2)) * 10;

            currentRotateX += (targetRotateX - currentRotateX) * 0.1;
            currentRotateY += (targetRotateY - currentRotateY) * 0.1;

            wrapper.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg) scale(1.01)`;
            
            requestAnimationFrame(updateTilt);
        }
        requestAnimationFrame(updateTilt);

        setInterval(() => {
            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];
            const clockEl = document.getElementById('live-clock');
            if(clockEl) {
                clockEl.innerHTML = `<i class="fa-regular fa-clock"></i> ${timeString}`;
            }
        }, 1000);

        const enterScreen = document.getElementById('enter-screen');
        const bgVideo = document.getElementById('bg-video');
        const bgAudio = document.getElementById('bg-audio');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressWrap = document.getElementById('progress-wrap');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const songNameDisplay = document.getElementById('song-name-display');

        bgAudio.volume = 0.5;
        let lastVolume = 0.5;

        muteBtn.addEventListener('click', () => {
            if (bgAudio.volume > 0) {
                lastVolume = bgAudio.volume;
                bgAudio.volume = 0;
                volumeSlider.value = 0;
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            } else {
                bgAudio.volume = lastVolume > 0 ? lastVolume : 0.5;
                volumeSlider.value = bgAudio.volume;
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            bgAudio.volume = val;
            if (val === 0) {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            } else {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            }
        });

        function loadTrack(index) {
            currentTrackIndex = index;
            bgAudio.src = playlist[currentTrackIndex].file;
            songNameDisplay.textContent = playlist[currentTrackIndex].title;
            bgAudio.load();
        }

        loadTrack(currentTrackIndex);

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        enterScreen.addEventListener('click', () => {
            enterScreen.classList.add('fade-out');
            setTimeout(() => { enterScreen.style.display = 'none'; }, 400);
            
            if (bgVideo) bgVideo.play().catch(e => console.log("Video play blocked:", e));
            if (bgAudio) {
                bgAudio.play().then(() => {
                    playIcon.className = "fa-solid fa-pause";
                }).catch(e => console.log("Audio play blocked:", e));
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (bgAudio.paused) {
                bgAudio.play();
                playIcon.className = "fa-solid fa-pause";
            } else {
                bgAudio.pause();
                playIcon.className = "fa-solid fa-play";
            }
        });

        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            bgAudio.play();
            playIcon.className = "fa-solid fa-pause";
        });

        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            bgAudio.play();
            playIcon.className = "fa-solid fa-pause";
        });

        bgAudio.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            bgAudio.play();
        });

        bgAudio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(bgAudio.duration);
        });

        let isDragging = false;

        function getClientX(e) {
            return e.touches ? e.touches[0].clientX : e.clientX;
        }

        function updateProgressFromEvent(e) {
            const rect = progressWrap.getBoundingClientRect();
            let clientX = getClientX(e);
            let clickX = clientX - rect.left;
            if (clickX < 0) clickX = 0;
            if (clickX > rect.width) clickX = rect.width;
            
            const percent = (clickX / rect.width) * 100;
            progressBar.style.width = percent + '%';
            
            if (bgAudio.duration) {
                const targetTime = (clickX / rect.width) * bgAudio.duration;
                currentTimeEl.textContent = formatTime(targetTime);
            }
        }

        // Hỗ trợ chuột và cảm ứng cho thanh tua nhạc
        progressWrap.addEventListener('mousedown', (e) => {
            isDragging = true;
            updateProgressFromEvent(e);
        });

        progressWrap.addEventListener('touchstart', (e) => {
            isDragging = true;
            updateProgressFromEvent(e);
        }, { passive: true });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                updateProgressFromEvent(e);
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                updateProgressFromEvent(e);
            }
        }, { passive: true });

        function stopDragging(e) {
            if (isDragging) {
                isDragging = false;
                const rect = progressWrap.getBoundingClientRect();
                let clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                let clickX = clientX - rect.left;
                if (clickX < 0) clickX = 0;
                if (clickX > rect.width) clickX = rect.width;
                
                if (bgAudio.duration) {
                    bgAudio.currentTime = (clickX / rect.width) * bgAudio.duration;
                }
            }
        }

        window.addEventListener('mouseup', stopDragging);
        window.addEventListener('touchend', stopDragging);

        bgAudio.addEventListener('timeupdate', () => {
            if (!isDragging && bgAudio.duration) {
                const percent = (bgAudio.currentTime / bgAudio.duration) * 100;
                progressBar.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(bgAudio.currentTime);
            }
        });

        const snowCanvas = document.getElementById('snow-canvas');
        const snowCtx = snowCanvas.getContext('2d');
        function resizeSnow() {
            snowCanvas.width = window.innerWidth;
            snowCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeSnow);
        resizeSnow();

        const snowflakes = Array.from({length: 70}, () => ({
            x: Math.random() * snowCanvas.width,
            y: Math.random() * snowCanvas.height,
            radius: Math.random() * 2 + 0.5,
            speedY: Math.random() * 0.6 + 0.3,
            speedX: Math.random() * 0.4 - 0.2
        }));

        function drawSnow() {
            snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
            snowCtx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            snowCtx.beginPath();
            snowflakes.forEach(f => {
                snowCtx.moveTo(f.x, f.y);
                snowCtx.arc(f.x, f.y, f.radius, 0, Math.PI * 2, true);
            });
            snowCtx.fill();
            snowflakes.forEach(f => {
                f.y += f.speedY;
                f.x += f.speedX;
                if (f.y > snowCanvas.height) { f.y = 0; f.x = Math.random() * snowCanvas.width; }
                if (f.x > snowCanvas.width) f.x = 0;
                else if (f.x < 0) f.x = snowCanvas.width;
            });
            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        const trailCanvas = document.getElementById('trail-canvas');
        const trailCtx = trailCanvas.getContext('2d');
        function resizeTrail() {
            trailCanvas.width = window.innerWidth;
            trailCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeTrail);
        resizeTrail();

        class Ribbon {
            constructor(length, stiffness, damping, hueOffset) {
                this.length = length;
                this.stiffness = stiffness;
                this.damping = damping;
                this.hueOffset = hueOffset;
                this.nodes = Array.from({length}, () => ({ x: mouseX, y: mouseY, vx: 0, vy: 0 }));
            }
            update() {
                let tx = mouseX, ty = mouseY;
                this.nodes.forEach(node => {
                    node.vx = node.vx * this.damping + (tx - node.x) * this.stiffness;
                    node.vy = node.vy * this.damping + (ty - node.y) * this.stiffness;
                    node.x += node.vx;
                    node.y += node.vy;
                    tx = node.x; ty = node.y;
                });
            }
            draw(ctx, time) {
                if (this.nodes.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(this.nodes[0].x, this.nodes[0].y);
                for (let i = 1; i < this.nodes.length - 1; i++) {
                    let xc = (this.nodes[i].x + this.nodes[i + 1].x) / 2;
                    let yc = (this.nodes[i].y + this.nodes[i + 1].y) / 2;
                    ctx.quadraticCurveTo(this.nodes[i].x, this.nodes[i].y, xc, yc);
                }
                let hue = (time * 30 + this.hueOffset) % 360;
                ctx.strokeStyle = `hsla(${hue}, 90%, 65%, 0.85)`;
                ctx.lineWidth = 0.8;
                ctx.shadowBlur = 8;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.7)`;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        const ribbons = Array.from({length: 15}, (_, i) => new Ribbon(24 + i * 1.3, 0.35 - i * 0.008, 0.33 + i * 0.004, i * 24));
        let time = 0;
        function animateRibbons() {
            trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
            time += 0.02;
            ribbons.forEach(ribbon => { ribbon.update(); ribbon.draw(trailCtx, time); });
            requestAnimationFrame(animateRibbons);
        }
        animateRibbons();

        const phrases = [
            "Sự từ chối khiến một người mạnh mẽ hơn",
            "Tôi không bao giờ bỏ cuộc, Đó là nhẫn đạo của tôi"
        ];
        
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const bioElement = document.getElementById('typing-bio');

        function loopTypewriter() {
            const currentPhrase = phrases[phraseIndex];
            
            if (isDeleting) {
                bioElement.innerHTML = currentPhrase.substring(0, charIndex) + '<span class="typing-cursor"></span>';
                charIndex--;
                if (charIndex < 0) {
                    isDeleting = false;
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    setTimeout(loopTypewriter, 500);
                    return;
                }
                setTimeout(loopTypewriter, 40);
            } else {
                bioElement.innerHTML = currentPhrase.substring(0, charIndex) + '<span class="typing-cursor"></span>';
                charIndex++;
                if (charIndex > currentPhrase.length) {
                    isDeleting = true;
                    setTimeout(loopTypewriter, 2000);
                    return;
                }
                setTimeout(loopTypewriter, 80);
            }
        }
        loopTypewriter();

        const DISCORD_USER_ID = "1317692648521203772";
        const INVITE_CODE = "g5VSce56e";

        async function loadDiscordData() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
                const data = await response.json();

                if (data.success) {
                    const user = data.data.discord_user;
                    
                    const displayName = user.global_name || user.username || "xehoi";
                    document.getElementById('dc-name').innerText = displayName;

                    if (user.avatar) {
                        const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=256`;
                        document.getElementById('dc-avatar').src = avatarUrl;
                    }

                    const decorationImg = document.getElementById('xehoi-decor');
                    if (user.avatar_decoration_data && user.avatar_decoration_data.asset) {
                        const assetId = user.avatar_decoration_data.asset;
                        decorationImg.src = `https://cdn.discordapp.com/avatar-decoration-presets/${assetId}.png?size=256`;
                        decorationImg.style.display = 'block';
                    } else {
                        decorationImg.style.display = 'none';
                    }

                    const status = data.data.discord_status;
                    const statusDot = document.getElementById('dc-status-dot');
                    
                    let color = '#71717a';
                    if (status === 'online') color = '#22c55e';
                    else if (status === 'idle') color = '#eab308';
                    else if (status === 'dnd') color = '#ef4444';

                    if (statusDot) statusDot.style.backgroundColor = color;

                    const activities = data.data.activities || [];
                    const customStatus = activities.find(act => act.type === 4);
                    const statusText = (customStatus && customStatus.state) ? customStatus.state : "cla on tộp";
                    document.getElementById('dc-sub').innerText = statusText;
                }
            } catch (error) {
                console.error("Lỗi đồng bộ Discord User:", error);
                document.getElementById('dc-name').innerText = "xehoi";
                document.getElementById('dc-sub').innerText = "cla on tộp";
            }
        }

        async function loadServerData() {
            try {
                const response = await fetch(`https://discord.com/api/v9/invites/${INVITE_CODE}?with_counts=true`);
                const data = await response.json();

                if (data && data.guild) {
                    document.getElementById('sv-name').innerText = data.guild.name;
                    
                    const onlineCount = data.approximate_presence_count || 0;
                    document.getElementById('sv-sub').innerHTML = `🟢 ${onlineCount} Online`;

                    if (data.guild.id && data.guild.icon) {
                        const iconUrl = `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.png?size=128`;
                        document.getElementById('sv-icon').src = iconUrl;
                    }
                }
            } catch (error) {
                console.error("Lỗi tải thông tin server:", error);
                document.getElementById('sv-name').innerText = "Cla family";
                document.getElementById('sv-sub').innerText = "🟢 Nhấn để tham gia";
            }
        }

        loadDiscordData();
        loadServerData();
        setInterval(loadDiscordData, 10000);
        setInterval(loadServerData, 30000);
    </script>
